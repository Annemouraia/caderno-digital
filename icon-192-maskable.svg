<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circular (para maskable) -->
  <circle cx="96" cy="96" r="90" fill="#0a0e27"/>
  
  <!-- Círculos concêntricos (centro) -->
  <g transform="translate(96, 70)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ff006e" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#00d4ff" opacity="0.9"/>
  </g>
  
  <!-- Livro -->
  <g transform="translate(96, 110)">
    <rect x="-15" y="-4" width="30" height="15" fill="none" stroke="#00d4ff" stroke-width="1.5" rx="2"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#00d4ff" stroke-width="0.8" opacity="0.5"/>
  </g>
  
  <!-- Microfone -->
  <g transform="translate(75, 115)" opacity="0.8">
    <circle cx="0" cy="0" r="3" fill="#ff006e"/>
    <rect x="-1.5" y="3" width="3" height="8" fill="#ff006e"/>
  </g>
</svg>
