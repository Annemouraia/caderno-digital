<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circular (para maskable) -->
  <circle cx="256" cy="256" r="240" fill="#0a0e27"/>
  
  <!-- Círculos concêntricos (centro) -->
  <g transform="translate(256, 200)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.8"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ff006e" stroke-width="4" opacity="0.8"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.8"/>
    <circle cx="0" cy="0" r="15" fill="#00d4ff" opacity="0.9"/>
  </g>
  
  <!-- Livro -->
  <g transform="translate(256, 310)">
    <rect x="-50" y="-12" width="100" height="40" fill="none" stroke="#00d4ff" stroke-width="4" rx="8"/>
    <line x1="-50" y1="8" x2="50" y2="8" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Microfone esquerdo -->
  <g transform="translate(160, 330)" opacity="0.8">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ff006e" stroke-width="3"/>
    <rect x="-5" y="10" width="10" height="30" fill="#ff006e"/>
  </g>
  
  <!-- Notas direita -->
  <g transform="translate(340, 300)" opacity="0.7">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#0099ff" stroke-width="3"/>
    <line x1="0" y1="20" x2="80" y2="20" stroke="#0099ff" stroke-width="3"/>
    <line x1="0" y1="40" x2="70" y2="40" stroke="#0099ff" stroke-width="3"/>
  </g>
</svg>
