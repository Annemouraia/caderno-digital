<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0e27"/>
  
  <!-- Gradient border -->
  <rect x="30" y="30" width="452" height="452" fill="none" stroke="url(#grad)" stroke-width="8" rx="80"/>
  
  <!-- Círculos concêntricos animados (centro) -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.8"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ff006e" stroke-width="4" opacity="0.8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.8"/>
    <circle cx="0" cy="0" r="20" fill="#00d4ff" opacity="0.9"/>
  </g>
  
  <!-- Linhas verticais esquerda -->
  <g opacity="0.6">
    <line x1="100" y1="120" x2="100" y2="280" stroke="#ff006e" stroke-width="3"/>
    <line x1="115" y1="120" x2="115" y2="280" stroke="#ff006e" stroke-width="2" opacity="0.7"/>
    <line x1="130" y1="120" x2="130" y2="280" stroke="#ff006e" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Linhas verticais direita -->
  <g opacity="0.6">
    <line x1="382" y1="120" x2="382" y2="280" stroke="#00d4ff" stroke-width="3"/>
    <line x1="397" y1="120" x2="397" y2="280" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
    <line x1="412" y1="120" x2="412" y2="280" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Livro/Caderno (abaixo) -->
  <g transform="translate(256, 350)">
    <rect x="-50" y="-12" width="100" height="40" fill="none" stroke="#00d4ff" stroke-width="4" rx="8"/>
    <line x1="-50" y1="8" x2="50" y2="8" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
    <text x="0" y="30" font-size="24" text-anchor="middle" fill="#ff006e" font-weight="bold">📓</text>
  </g>
  
  <!-- Microfone (lado esquerdo) -->
  <g transform="translate(120, 380)" opacity="0.8">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ff006e" stroke-width="3"/>
    <rect x="-6" y="12" width="12" height="35" fill="#ff006e"/>
    <ellipse cx="0" cy="50" rx="15" ry="8" fill="none" stroke="#ff006e" stroke-width="2"/>
  </g>
  
  <!-- Notas/Texto (lado direito) -->
  <g transform="translate(360, 360)" opacity="0.7">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#0099ff" stroke-width="3"/>
    <line x1="0" y1="20" x2="100" y2="20" stroke="#0099ff" stroke-width="3"/>
    <line x1="0" y1="40" x2="90" y2="40" stroke="#0099ff" stroke-width="3"/>
  </g>
</svg>
