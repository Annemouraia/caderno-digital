<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed">
    <meta name="description" content="Caderno Digital de Estudos - Gerenciador inteligente de notas, flashcards e progresso">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caderno Digital">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='75' font-size='90' text-anchor='middle'>📓</text></svg>">
    <title>📓 Caderno Digital de Estudos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #7c3aed;
            --secondary: #06b6d4;
            --accent: #ff1493;
            --danger: #ff1744;
            --bg-dark: #0f0a1e;
            --bg-light: #1a1530;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(124, 58, 237, 0.4);
            --text: #ffffff;
            --text-light: #b0b0c0;
            --text-secondary: #06b6d4;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0a1e 0%, #1a1530 50%, #2d1a4d 100%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            font-size: 16px;
        }

        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2d1a4d 0%, #3d2645 50%, #1a0f3d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease-in-out 2.5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; pointer-events: none; }
        }

        .splash-content {
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            max-width: 700px;
            padding: 20px;
        }

        .splash-robot {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .splash-text h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 700;
            color: white;
        }

        .splash-text p {
            font-size: 1.2rem;
            margin: 10px 0 0 0;
            opacity: 0.85;
            color: #06b6d4;
        }

        /* Elementos flutuantes decorativos */
        body::before {
            content: '';
            position: fixed;
            top: -10%;
            right: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            left: -5%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: float-reverse 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(20px) scale(0.95); }
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 1;
        }

        header {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(124, 58, 237, 0.6);
            color: var(--text);
            padding: 40px 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 
                0 8px 32px 0 rgba(124, 58, 237, 0.2),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.2rem;
            color: var(--text-light);
            font-weight: 300;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(124, 58, 237, 0.3);
            color: var(--text-light);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: rgba(124, 58, 237, 0.8);
            color: var(--text);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
            border-color: rgba(255, 255, 255, 0.5);
            color: var(--text);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
        }

        .tabs-content {
            position: relative;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(124, 58, 237, 0.4);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 
                0 8px 32px 0 rgba(124, 58, 237, 0.15),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.05) 0%, rgba(6, 182, 212, 0.05) 100%);
            pointer-events: none;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--text);
            font-weight: 700;
        }

        .card h3 {
            font-size: 1.5rem;
            margin: 15px 0;
            color: var(--text);
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(124, 58, 237, 0.3);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder,
        textarea::placeholder {
            color: var(--text-light);
            opacity: 0.7;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.8);
            box-shadow: 0 0 16px rgba(124, 58, 237, 0.3);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }

        button {
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            border: 2px solid rgba(168, 85, 247, 0.5);
            color: var(--text);
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
            background: linear-gradient(135deg, #a855f7 0%, #d946ef 100%);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.4);
            background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            border-color: rgba(255, 20, 147, 0.5);
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3);
        }

        .btn-danger:hover {
            box-shadow: 0 8px 24px rgba(255, 20, 147, 0.4);
        }

        .chat-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        .chat-message {
            margin-bottom: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            max-width: 90%;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideIn 0.3s ease;
        }

        .chat-message.usuario {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.3) 0%, rgba(124, 58, 237, 0.1) 100%);
            border-left: 4px solid var(--primary);
            margin-left: auto;
            text-align: left;
        }

        .chat-message.ia {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.3) 0%, rgba(6, 182, 212, 0.1) 100%);
            border-left: 4px solid var(--secondary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Elementos flutuantes decorativos (bolas) */
        .floating-element {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-element.blue {
            background: radial-gradient(circle at 30% 30%, rgba(6, 182, 212, 0.8), rgba(6, 182, 212, 0.2));
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.6);
        }

        .floating-element.purple {
            background: radial-gradient(circle at 30% 30%, rgba(124, 58, 237, 0.8), rgba(124, 58, 237, 0.2));
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.6);
        }

        .floating-element.pink {
            background: radial-gradient(circle at 30% 30%, rgba(255, 20, 147, 0.8), rgba(255, 20, 147, 0.2));
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.6);
        }

        /* Botão flutuante de configuração */
        #btnFloatingConfig {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            border: 3px solid rgba(255, 255, 255, 0.3);
            color: var(--text);
            font-size: 2rem;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #btnFloatingConfig:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.6);
        }

        #btnFloatingConfig:active {
            transform: scale(0.95);
        }

        /* Modal de configurações */
        #modalConfigurações {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(15, 10, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(124, 58, 237, 0.5);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--text);
        }

        .modal-content button {
            width: 100%;
            margin-top: 10px;
        }

        /* Grid de matérias */
        #materiasContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .materia-card {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2) 0%, rgba(6, 182, 212, 0.1) 100%);
            border: 2px solid rgba(124, 58, 237, 0.5);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .materia-card:hover {
            transform: translateY(-4px);
            border-color: rgba(124, 58, 237, 0.8);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.3);
        }

        .materia-card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .materia-card p {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 15px;
        }

        .materia-card button {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            font-size: 0.9rem;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }

            .card {
                padding: 20px;
            }

            .tabs {
                gap: 5px;
            }

            .tab-btn {
                padding: 10px 16px;
                font-size: 0.9rem;
            }

            #materiasContainer {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .chat-container {
                height: 300px;
            }
        }

        /* Scrollbar customizado */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(124, 58, 237, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #7c3aed 0%, #06b6d4 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #a855f7 0%, #0891b2 100%);
        }
    </style>
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="splashScreen">
        <div class="splash-content">
            <div class="splash-robot">
                <svg width="140" height="160" viewBox="0 0 120 140" style="filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.3));">
                    <!-- Cabeça -->
                    <rect x="30" y="15" width="60" height="50" rx="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
                    
                    <!-- Olhos -->
                    <circle cx="45" cy="35" r="6" fill="#06b6d4"/>
                    <circle cx="75" cy="35" r="6" fill="#06b6d4"/>
                    
                    <!-- Antena -->
                    <line x1="60" y1="15" x2="60" y2="-5" stroke="#7c3aed" stroke-width="2"/>
                    <circle cx="60" cy="-8" r="3" fill="#7c3aed"/>
                    
                    <!-- Corpo -->
                    <rect x="25" y="70" width="70" height="45" rx="6" fill="none" stroke="#06b6d4" stroke-width="2"/>
                    
                    <!-- Botão central -->
                    <circle cx="60" cy="95" r="5" fill="#ff1493"/>
                    
                    <!-- Braços -->
                    <line x1="25" y1="80" x2="5" y2="75" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
                    <line x1="95" y1="80" x2="115" y2="75" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
                    
                    <!-- Pernas -->
                    <line x1="40" y1="115" x2="40" y2="135" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
                    <line x1="80" y1="115" x2="80" y2="135" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
                    
                    <!-- Pés -->
                    <circle cx="40" cy="138" r="2" fill="#06b6d4"/>
                    <circle cx="80" cy="138" r="2" fill="#06b6d4"/>
                </svg>
            </div>
            <div class="splash-text">
                <h1>Code & Learn</h1>
                <p>AI-Powered Study</p>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <div>
                <h1>📓 CADERNO DIGITAL</h1>
                <p>Seu assistente inteligente de estudos</p>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="app.switchTab('notas')">📝 Notas</button>
            <button class="tab-btn" onclick="app.switchTab('gravacao')">🎤 Gravar Nota</button>
            <button class="tab-btn" onclick="app.switchTab('flashcards')">🃏 Flashcards</button>
            <button class="tab-btn" onclick="app.switchTab('provas')">📋 Provas</button>
            <button class="tab-btn" onclick="app.switchTab('materias')">📚 Matérias</button>
            <button class="tab-btn" onclick="app.switchTab('assistente')">💬 Assistente</button>
            <button class="tab-btn" onclick="app.switchTab('progresso')">📊 Progresso</button>
        </div>

        <div class="tabs-content">
            <!-- NOTAS -->
            <div id="notas" class="tab-content active">
                <div class="card">
                    <h2>📝 Minhas Notas</h2>
                    <select id="materiaSelecionada" style="margin-bottom: 20px; font-size: 1.1rem;" onchange="app.renderNotas()">
                        <option value="">-- Todas as Matérias --</option>
                    </select>
                    
                    <div id="formNota">
                        <input type="hidden" id="notaEditandoId" value="">
                        <input type="text" id="tituloNota" placeholder="Título da nota..." style="font-size: 1.1rem;">
                        <textarea id="conteudoNota" placeholder="Escreva aqui... (salva automaticamente ⏱️)" style="font-size: 1.05rem; min-height: 200px;"></textarea>
                        
                        <div id="imagensContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 15px 0;"></div>
                        
                        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                            <button onclick="document.getElementById('imagemInput').click()" style="flex: 1; font-size: 0.95rem; background: var(--secondary); padding: 10px; border: none; border-radius: 8px; color: white; cursor: pointer;">📷 Foto/Imagem</button>
                            <button onclick="app.removerUltimaImagem()" class="btn-danger" style="flex: 1; font-size: 0.95rem;">🗑️ Remover Última</button>
                        </div>
                        <input type="file" id="imagemInput" accept="image/*" style="display: none;" onchange="app.adicionarImagem(event)">
                        
                        <div style="display: flex; gap: 10px;">
                            <button onclick="app.adicionarOuEditarNota()" style="flex: 1; font-size: 1rem;" id="btnSalvarNota">➕ Nova Nota</button>
                            <button onclick="app.cancelarEdicao()" class="btn-secondary" style="flex: 1; font-size: 1rem; display: none;" id="btnCancelar">❌ Cancelar</button>
                            <button onclick="app.downloadBackup()" class="btn-secondary" style="flex: 1; font-size: 1rem;">📥 Download</button>
                            <button onclick="document.getElementById('fileInput').click()" class="btn-secondary" style="flex: 1; font-size: 1rem;">📤 Upload</button>
                        </div>
                        <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="app.uploadBackup(event)">
                        <p style="color: var(--text-light); font-size: 0.9rem; margin-top: 10px;">💡 Dica: Suas notas são salvas automaticamente!</p>
                    </div>
                    
                    <div id="notasContainer" style="margin-top: 25px;"></div>
                </div>
            </div>

            <!-- GRAVAR NOTA -->
            <div id="gravacao" class="tab-content">
                <div class="card">
                    <h2>🎤 Gravar Nota por Voz</h2>
                    <select id="gravarMateriaSelect" style="margin-bottom: 15px; font-size: 1.1rem;">
                        <option value="">-- Selecione Matéria --</option>
                    </select>
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <button onclick="app.iniciarGravacao()" style="flex: 1; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); font-size: 1rem;">🎤 Iniciar</button>
                        <button onclick="app.pararGravacao()" style="flex: 1; background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%); font-size: 1rem;">⏹️ Parar</button>
                        <button onclick="app.limparGravacao()" class="btn-danger" style="flex: 1; font-size: 1rem;">🗑️ Limpar</button>
                    </div>
                    <textarea id="transcricao" placeholder="Sua transcrição aparecerá aqui..." style="font-size: 1.05rem; margin-bottom: 20px;"></textarea>
                    <button onclick="app.salvarGravacao()" style="width: 100%; font-size: 1.1rem;">💾 Salvar como Nota</button>
                </div>
            </div>

            <!-- FLASHCARDS -->
            <div id="flashcards" class="tab-content">
                <div class="card">
                    <h2>🃏 Flashcards</h2>
                    <select id="flashcardMateria" style="margin-bottom: 15px; font-size: 1.1rem;">
                        <option value="">-- Todas as Matérias --</option>
                    </select>
                    <input type="text" id="pergunta" placeholder="Pergunta..." style="font-size: 1.1rem;">
                    <textarea id="resposta" placeholder="Resposta..." style="font-size: 1.05rem;"></textarea>
                    <button onclick="app.adicionarFlashcard()" style="width: 100%; font-size: 1.1rem;">➕ Adicionar Flashcard</button>
                    <div id="flashcardsContainer" style="margin-top: 25px;"></div>
                </div>
            </div>

            <!-- PROVAS -->
            <div id="provas" class="tab-content">
                <div class="card">
                    <h2>📋 Provas e Avaliações</h2>
                    <select id="prova_materia" style="margin-bottom: 15px; font-size: 1.1rem;">
                        <option value="">-- Selecione Matéria --</option>
                    </select>
                    <input type="text" id="prova_tipo" placeholder="Tipo (prova, trabalho, apresentação...)..." style="font-size: 1.1rem;">
                    <input type="date" id="prova_data" style="font-size: 1.1rem;">
                    <textarea id="prova_conteudo" placeholder="Conteúdo para estudar..." style="font-size: 1.05rem;"></textarea>
                    <select id="prova_status" style="margin-bottom: 15px; font-size: 1.1rem;">
                        <option value="não estudada">❌ Não Estudada</option>
                        <option value="estudando">📚 Estudando</option>
                        <option value="estudada">✅ Estudada</option>
                    </select>
                    <button onclick="app.adicionarProva()" style="width: 100%; font-size: 1.1rem;">➕ Adicionar Prova</button>
                    <div id="provasContainer" style="margin-top: 25px;"></div>
                </div>
            </div>

            <!-- MATÉRIAS -->
            <div id="materias" class="tab-content">
                <div class="card">
                    <h2>📚 Minhas Matérias</h2>
                    <div id="mensagem" style="margin-bottom: 15px; font-size: 1.1rem; font-weight: bold;"></div>
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="novaMateria" placeholder="Nome da matéria..." style="flex: 1; font-size: 1.1rem;">
                        <button onclick="app.adicionarMateria()" style="background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); font-size: 1rem;">➕ Adicionar</button>
                    </div>
                    <div id="materiasContainer"></div>
                </div>
            </div>

            <!-- ASSISTENTE IA -->
            <div id="assistente" class="tab-content">
                <div class="card">
                    <h2>💬 Assistente IA</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                        <div>
                            <label style="color: var(--text-light); font-size: 0.95rem; display: block; margin-bottom: 8px;">📚 Matéria</label>
                            <select id="assistentemateria" style="font-size: 1rem;">
                                <option value="">-- Geral --</option>
                            </select>
                        </div>
                        <div>
                            <label style="color: var(--text-light); font-size: 0.95rem; display: block; margin-bottom: 8px;">💡 Tipo</label>
                            <select id="assistenteTipo" style="font-size: 1rem;">
                                <option value="geral">Pergunta Geral</option>
                                <option value="explicar">Explicar</option>
                                <option value="exemplo">Exemplos</option>
                                <option value="resumo">Resumo</option>
                            </select>
                        </div>
                    </div>
                    <div class="chat-container" id="chatContainer" style="font-size: 1rem;"></div>
                    <input type="text" id="perguntaAssistente" placeholder="Sua pergunta..." style="font-size: 1rem; margin-bottom: 12px;">
                    <button onclick="app.enviarPergunta()" style="width: 100%; font-size: 1.1rem;">Enviar ➤</button>
                </div>
            </div>

            <!-- PROGRESSO -->
            <div id="progresso" class="tab-content">
                <div class="card">
                    <h2>📊 Seu Progresso</h2>
                    <div id="progressoContainer" style="font-size: 1.05rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTÃO FLUTUANTE DE CONFIGURAÇÕES -->
    <button id="btnFloatingConfig" onclick="app.abrirConfigurações()">⚙️</button>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div id="modalConfigurações" style="display: none;">
        <div class="modal-content">
            <h2>⚙️ Configurações</h2>
            <label style="color: var(--text-light); display: block; margin-bottom: 8px; font-size: 1rem;">🔑 API Key Anthropic</label>
            <input type="password" id="apiKeyInput" placeholder="Sua API Key..." style="font-size: 1rem;">
            <label style="color: var(--text-light); display: block; margin-top: 20px; margin-bottom: 8px; font-size: 1rem;">☁️ Supabase URL</label>
            <input type="text" id="supabaseUrlInput" placeholder="https://seu-projeto.supabase.co" style="font-size: 1rem;">
            <label style="color: var(--text-light); display: block; margin-top: 20px; margin-bottom: 8px; font-size: 1rem;">🔓 Supabase Anon Key</label>
            <input type="text" id="supabaseKeyInput" placeholder="Sua chave pública..." style="font-size: 1rem;">
            <button onclick="app.salvarApiKey()" style="margin-top: 20px; width: 100%; font-size: 1rem;">✅ Salvar Configurações</button>
            <button onclick="app.apagarApiKey()" class="btn-danger" style="margin-top: 10px; width: 100%; font-size: 1rem;">🗑️ Apagar Dados</button>
            <button onclick="app.fecharConfigurações()" class="btn-secondary" style="margin-top: 10px; width: 100%; font-size: 1rem;">❌ Cancelar</button>
        </div>
    </div>

    <script>
        const app = {
            notas: [],
            flashcards: [],
            provas: [],
            chat: [],
            materias: [],
            imagensTemporarias: [],

            init() {
                this.carregarDados();
                this.atualizarSelectMaterias();
                this.renderNotas();
                this.renderFlashcards();
                this.renderProvas();
                this.renderProgresso();
                
                // Auto-save para notas enquanto digita
                const conteudoNotaInput = document.getElementById('conteudoNota');
                const tituloNotaInput = document.getElementById('tituloNota');
                
                if (conteudoNotaInput && tituloNotaInput) {
                    conteudoNotaInput.addEventListener('input', () => this.autoSalvarNota());
                    tituloNotaInput.addEventListener('input', () => this.autoSalvarNota());
                }
            },

            autoSalvarNota() {
                const titulo = document.getElementById('tituloNota').value.trim();
                const conteudo = document.getElementById('conteudoNota').value.trim();
                const notaEditandoId = document.getElementById('notaEditandoId').value;
                
                // Se estou editando uma nota, atualiza em tempo real
                if (notaEditandoId && titulo && conteudo) {
                    this.notas = this.notas.map(n => 
                        n.id === parseInt(notaEditandoId) 
                            ? { ...n, titulo, conteudo, dataEdicao: new Date().toLocaleDateString('pt-BR') }
                            : n
                    );
                    this.salvarDados();
                    console.log('💾 Nota atualizada automaticamente');
                }
            },

            carregarDados() {
                this.notas = JSON.parse(localStorage.getItem('notas') || '[]');
                this.provas = JSON.parse(localStorage.getItem('provas') || '[]');
                this.flashcards = JSON.parse(localStorage.getItem('flashcards') || '[]');
                this.chat = JSON.parse(localStorage.getItem('chat') || '[]');
                this.materias = JSON.parse(localStorage.getItem('materias') || '[]');
                this.renderMaterias();
                this.renderChat();
            },

            salvarDados() {
                localStorage.setItem('notas', JSON.stringify(this.notas));
                localStorage.setItem('provas', JSON.stringify(this.provas));
                localStorage.setItem('flashcards', JSON.stringify(this.flashcards));
                localStorage.setItem('chat', JSON.stringify(this.chat));
                localStorage.setItem('materias', JSON.stringify(this.materias));
            },

            switchTab(tabName) {
                document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(tabName).classList.add('active');
                event.target.classList.add('active');
            },

            // ===== MATÉRIAS =====
            adicionarMateria() {
                const input = document.getElementById('novaMateria');
                const nome = input.value.trim();
                
                if (!nome) {
                    this.mostrarMensagem('❌ Digite o nome da matéria!', 'materias');
                    return;
                }
                
                if (this.materias.find(m => m.nome.toLowerCase() === nome.toLowerCase())) {
                    this.mostrarMensagem('⚠️ Matéria já existe!', 'materias');
                    return;
                }
                
                this.materias.push({
                    id: Date.now(),
                    nome: nome,
                    dataCriacao: new Date().toLocaleDateString('pt-BR')
                });
                
                this.salvarDados();
                this.renderMaterias();
                this.atualizarSelectMaterias();
                input.value = '';
                this.mostrarMensagem('✅ Matéria adicionada!', 'materias');
            },

            removerMateria(id) {
                if (confirm('Tem certeza que quer deletar esta matéria?')) {
                    this.materias = this.materias.filter(m => m.id !== id);
                    this.salvarDados();
                    this.renderMaterias();
                    this.atualizarSelectMaterias();
                    this.mostrarMensagem('✅ Matéria removida!', 'materias');
                }
            },

            renderMaterias() {
                const container = document.getElementById('materiasContainer');
                if (!container) return;
                
                this.atualizarSelectMaterias();
                
                if (this.materias.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; color: var(--text-light); font-size: 1rem;">Nenhuma matéria adicionada ainda.</p>';
                    return;
                }
                
                container.innerHTML = this.materias.map(m => `
                    <div class="materia-card">
                        <h3>📚 ${m.nome}</h3>
                        <p>Criada: ${m.dataCriacao}</p>
                        <button onclick="app.editarMateria(${m.id})" style="font-size: 0.95rem;">✏️ Editar</button>
                        <button onclick="app.removerMateria(${m.id})" class="btn-danger" style="font-size: 0.95rem;">🗑️ Deletar</button>
                    </div>
                `).join('');
            },

            editarMateria(id) {
                const materia = this.materias.find(m => m.id === id);
                if (!materia) return;
                
                const novoNome = prompt('Novo nome da matéria:', materia.nome);
                if (novoNome && novoNome.trim()) {
                    materia.nome = novoNome.trim();
                    this.salvarDados();
                    this.renderMaterias();
                    this.atualizarSelectMaterias();
                    this.mostrarMensagem('✅ Matéria atualizada!', 'materias');
                }
            },

            atualizarSelectMaterias() {
                const selects = document.querySelectorAll('#materiaSelecionada, #gravarMateriaSelect, #flashcardMateria, #prova_materia, #assistentemateria');
                
                selects.forEach(select => {
                    const valorAtual = select.value;
                    const primeiraOpcao = select.querySelector('option:first-child');
                    
                    const options = Array.from(select.querySelectorAll('option')).slice(1);
                    options.forEach(opt => opt.remove());
                    
                    this.materias.forEach(m => {
                        const option = document.createElement('option');
                        option.value = m.nome;
                        option.textContent = m.nome;
                        select.appendChild(option);
                    });
                    
                    select.value = valorAtual;
                });
            },

            mostrarMensagem(msg, aba) {
                const el = document.getElementById('mensagem');
                if (el && aba === 'materias') {
                    el.textContent = msg;
                    el.style.color = msg.includes('❌') ? '#ff1493' : msg.includes('⚠️') ? '#06b6d4' : '#06b6d4';
                    setTimeout(() => el.textContent = '', 3000);
                }
            },

            // ===== NOTAS =====
            adicionarOuEditarNota() {
                const titulo = document.getElementById('tituloNota').value.trim();
                const conteudo = document.getElementById('conteudoNota').value.trim();
                const notaEditandoId = document.getElementById('notaEditandoId').value;
                const materia = document.getElementById('materiaSelecionada').value || 'Geral';
                
                if (!titulo || !conteudo) {
                    alert('❌ Preencha título e conteúdo!');
                    return;
                }
                
                if (notaEditandoId) {
                    // Editando nota existente
                    this.notas = this.notas.map(n => 
                        n.id === parseInt(notaEditandoId) 
                            ? { ...n, titulo, conteudo, materia, dataEdicao: new Date().toLocaleDateString('pt-BR'), imagens: this.imagensTemporarias }
                            : n
                    );
                    alert('✅ Nota atualizada!');
                } else {
                    // Adicionando nova nota
                    this.notas.push({
                        id: Date.now(),
                        titulo,
                        conteudo,
                        materia,
                        data: new Date().toLocaleDateString('pt-BR'),
                        dataEdicao: null,
                        imagens: this.imagensTemporarias
                    });
                    alert('✅ Nota salva!');
                }
                
                this.salvarDados();
                this.renderNotas();
                this.cancelarEdicao();
            },

            editarNota(id) {
                const nota = this.notas.find(n => n.id === id);
                if (!nota) return;
                
                document.getElementById('notaEditandoId').value = id;
                document.getElementById('tituloNota').value = nota.titulo;
                document.getElementById('conteudoNota').value = nota.conteudo;
                document.getElementById('materiaSelecionada').value = nota.materia;
                
                // Carregar imagens da nota
                this.imagensTemporarias = nota.imagens || [];
                this.renderizarImagensTemporarias();
                
                document.getElementById('btnSalvarNota').textContent = '✏️ Atualizar Nota';
                document.getElementById('btnSalvarNota').style.backgroundColor = 'var(--secondary)';
                document.getElementById('btnCancelar').style.display = 'flex';
                
                document.getElementById('conteudoNota').focus();
                document.getElementById('conteudoNota').scrollIntoView({ behavior: 'smooth' });
            },

            cancelarEdicao() {
                document.getElementById('notaEditandoId').value = '';
                document.getElementById('tituloNota').value = '';
                document.getElementById('conteudoNota').value = '';
                document.getElementById('materiaSelecionada').value = '';
                
                document.getElementById('btnSalvarNota').textContent = '➕ Nova Nota';
                document.getElementById('btnSalvarNota').style.backgroundColor = 'var(--primary)';
                document.getElementById('btnCancelar').style.display = 'none';
                
                this.imagensTemporarias = [];
                this.renderizarImagensTemporarias();
            },

            adicionarImagem(event) {
                const arquivo = event.target.files[0];
                if (!arquivo) return;
                
                const leitor = new FileReader();
                leitor.onload = (e) => {
                    const imagemBase64 = e.target.result;
                    this.imagensTemporarias.push(imagemBase64);
                    this.renderizarImagensTemporarias();
                    console.log('🖼️ Imagem adicionada:', this.imagensTemporarias.length);
                };
                leitor.readAsDataURL(arquivo);
                
                // Limpar o input
                event.target.value = '';
            },

            removerUltimaImagem() {
                if (this.imagensTemporarias.length > 0) {
                    this.imagensTemporarias.pop();
                    this.renderizarImagensTemporarias();
                    console.log('🗑️ Imagem removida. Restam:', this.imagensTemporarias.length);
                }
            },

            renderizarImagensTemporarias() {
                const container = document.getElementById('imagensContainer');
                if (this.imagensTemporarias.length === 0) {
                    container.innerHTML = '';
                    return;
                }
                
                container.innerHTML = this.imagensTemporarias.map((img, idx) => `
                    <div style="position: relative; border-radius: 8px; overflow: hidden;">
                        <img src="${img}" style="width: 100%; height: 100px; object-fit: cover; cursor: pointer;" onclick="app.abrirImagemGrande(${idx})" alt="Foto ${idx + 1}">
                        <button onclick="app.removerImagemEspecifica(${idx})" style="position: absolute; top: 5px; right: 5px; background: var(--danger); border: none; color: white; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-size: 0.8rem; padding: 0;">✕</button>
                    </div>
                `).join('');
            },

            removerImagemEspecifica(idx) {
                this.imagensTemporarias.splice(idx, 1);
                this.renderizarImagensTemporarias();
            },

            abrirImagemGrande(idx) {
                const modal = document.createElement('div');
                modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999;';
                modal.innerHTML = `
                    <div style="position: relative;">
                        <img src="${this.imagensTemporarias[idx]}" style="max-width: 90vw; max-height: 90vh; border-radius: 10px;">
                        <button onclick="this.parentElement.parentElement.remove()" style="position: absolute; top: 10px; right: 10px; background: var(--danger); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer;">✕</button>
                    </div>
                `;
                document.body.appendChild(modal);
            },

            adicionarNota() {
                this.adicionarOuEditarNota();
            },

            removerNota(id) {
                if (confirm('Deletar esta nota?')) {
                    this.notas = this.notas.filter(n => n.id !== id);
                    this.salvarDados();
                    this.renderNotas();
                }
            },

            renderNotas() {
                const container = document.getElementById('notasContainer');
                const materia = document.getElementById('materiaSelecionada').value;
                
                let notasFiltradas = this.notas;
                if (materia) {
                    notasFiltradas = this.notas.filter(n => n.materia === materia);
                }
                
                if (notasFiltradas.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-light); font-size: 1rem;">📭 Nenhuma nota adicionada.</p>';
                    return;
                }
                
                container.innerHTML = notasFiltradas.map(nota => `
                    <div class="card" style="margin-top: 15px; border-left: 4px solid var(--secondary);">
                        <h3>${nota.titulo}</h3>
                        <p style="color: var(--text-light); font-size: 0.9rem;">📚 ${nota.materia} | 📅 ${nota.data}${nota.dataEdicao ? ' (✏️ ' + nota.dataEdicao + ')' : ''}</p>
                        <p style="font-size: 1rem; white-space: pre-wrap; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin: 15px 0;">${nota.conteudo}</p>
                        ${nota.imagens && nota.imagens.length > 0 ? `
                            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin: 15px 0;">
                                ${nota.imagens.map((img, idx) => `
                                    <img src="${img}" style="width: 100%; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer;" onclick="app.abrirImagemGrande('${idx}', '${nota.id}')">
                                `).join('')}
                            </div>
                        ` : ''}
                        <div style="display: flex; gap: 10px;">
                            <button onclick="app.editarNota(${nota.id})" style="flex: 1; font-size: 0.95rem; background: var(--secondary); padding: 10px; border: none; border-radius: 8px; color: white; cursor: pointer; transition: 0.3s;">✏️ Editar</button>
                            <button onclick="app.removerNota(${nota.id})" class="btn-danger" style="flex: 1; font-size: 0.95rem;">🗑️ Deletar</button>
                        </div>
                    </div>
                `).join('');
            },

            // ===== GRAVAÇÃO =====
            iniciarGravacao() {
                const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'pt-BR';
                recognition.continuous = true;
                
                recognition.onresult = (event) => {
                    let texto = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        texto += event.results[i][0].transcript + ' ';
                    }
                    document.getElementById('transcricao').value = texto;
                };
                
                recognition.start();
                alert('🎤 Gravação iniciada!');
                window.gravarRecognition = recognition;
            },

            pararGravacao() {
                if (window.gravarRecognition) {
                    window.gravarRecognition.stop();
                    alert('⏹️ Gravação parada!');
                }
            },

            limparGravacao() {
                document.getElementById('transcricao').value = '';
            },

            salvarGravacao() {
                const conteudo = document.getElementById('transcricao').value.trim();
                const materia = document.getElementById('gravarMateriaSelect').value || 'Geral';
                
                if (!conteudo) {
                    alert('❌ Transcreva algo primeiro!');
                    return;
                }
                
                this.notas.push({
                    id: Date.now(),
                    titulo: `Nota de Voz - ${new Date().toLocaleDateString()}`,
                    conteudo,
                    materia,
                    data: new Date().toLocaleDateString('pt-BR')
                });
                
                this.salvarDados();
                document.getElementById('transcricao').value = '';
                alert('✅ Nota salva!');
            },

            // ===== FLASHCARDS =====
            adicionarFlashcard() {
                const pergunta = document.getElementById('pergunta').value.trim();
                const resposta = document.getElementById('resposta').value.trim();
                const materia = document.getElementById('flashcardMateria').value || 'Geral';
                
                if (!pergunta || !resposta) {
                    alert('❌ Preencha pergunta e resposta!');
                    return;
                }
                
                this.flashcards.push({
                    id: Date.now(),
                    pergunta,
                    resposta,
                    materia,
                    acertou: false,
                    data: new Date().toLocaleDateString('pt-BR')
                });
                
                this.salvarDados();
                this.renderFlashcards();
                document.getElementById('pergunta').value = '';
                document.getElementById('resposta').value = '';
                alert('✅ Flashcard adicionado!');
            },

            removerFlashcard(id) {
                if (confirm('Deletar este flashcard?')) {
                    this.flashcards = this.flashcards.filter(f => f.id !== id);
                    this.salvarDados();
                    this.renderFlashcards();
                }
            },

            renderFlashcards() {
                const container = document.getElementById('flashcardsContainer');
                const materia = document.getElementById('flashcardMateria').value;
                
                let flashcardsFiltrados = this.flashcards;
                if (materia) {
                    flashcardsFiltrados = this.flashcards.filter(f => f.materia === materia);
                }
                
                if (flashcardsFiltrados.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-light); font-size: 1rem;">Nenhum flashcard adicionado.</p>';
                    return;
                }
                
                container.innerHTML = flashcardsFiltrados.map(fc => `
                    <div class="card" style="margin-top: 15px;">
                        <p style="color: var(--text-light); font-size: 0.95rem;">📚 ${fc.materia}</p>
                        <h3 style="margin-bottom: 10px;">❓ ${fc.pergunta}</h3>
                        <p style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; font-size: 1rem; margin-bottom: 15px;">✅ ${fc.resposta}</p>
                        <button onclick="app.removerFlashcard(${fc.id})" class="btn-danger" style="font-size: 0.95rem;">🗑️ Deletar</button>
                    </div>
                `).join('');
            },

            // ===== PROVAS =====
            adicionarProva() {
                const materia = document.getElementById('prova_materia').value || 'Geral';
                const tipo = document.getElementById('prova_tipo').value.trim() || 'Prova';
                const data = document.getElementById('prova_data').value;
                const conteudo = document.getElementById('prova_conteudo').value.trim();
                const status = document.getElementById('prova_status').value || 'não estudada';
                
                if (!data || !conteudo) {
                    alert('❌ Preencha data e conteúdo!');
                    return;
                }
                
                this.provas.push({
                    id: Date.now(),
                    materia,
                    tipo,
                    data,
                    conteudo,
                    status,
                    dataCriacao: new Date().toLocaleDateString('pt-BR')
                });
                
                this.salvarDados();
                this.renderProvas();
                document.getElementById('prova_tipo').value = '';
                document.getElementById('prova_data').value = '';
                document.getElementById('prova_conteudo').value = '';
                alert('✅ Prova adicionada!');
            },

            removerProva(id) {
                if (confirm('Deletar esta prova?')) {
                    this.provas = this.provas.filter(p => p.id !== id);
                    this.salvarDados();
                    this.renderProvas();
                }
            },

            renderProvas() {
                const container = document.getElementById('provasContainer');
                
                if (this.provas.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-light); font-size: 1rem;">Nenhuma prova adicionada.</p>';
                    return;
                }
                
                container.innerHTML = this.provas.map(prova => `
                    <div class="card" style="margin-top: 15px; border-left: 4px solid var(--secondary);">
                        <h3>${prova.tipo} - ${prova.materia}</h3>
                        <p style="color: var(--text-light); font-size: 0.95rem;">📅 ${prova.data} | ${prova.status}</p>
                        <p style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; font-size: 1rem; margin: 15px 0; white-space: pre-wrap;">${prova.conteudo}</p>
                        <button onclick="app.removerProva(${prova.id})" class="btn-danger" style="font-size: 0.95rem;">🗑️ Deletar</button>
                    </div>
                `).join('');
            },

            // ===== ASSISTENTE IA =====
            async enviarPergunta() {
                const apiKey = localStorage.getItem('apiKey');
                console.log('🔍 Verificando API Key...', apiKey ? '✅ Encontrada' : '❌ Não encontrada');
                
                if (!apiKey) {
                    alert('❌ Configure sua API Key primeiro! (⚙️ Config)');
                    return;
                }

                const pergunta = document.getElementById('perguntaAssistente').value.trim();
                const materia = document.getElementById('assistentemateria').value || 'geral';
                
                if (!pergunta) return;

                this.chat.push({ role: 'usuario', texto: pergunta });
                document.getElementById('perguntaAssistente').value = '';
                this.renderChat();

                try {
                    console.log('📤 Enviando pergunta para API Anthropic...');
                    const requestBody = {
                        model: 'claude-3-5-sonnet-20241022',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: `Matéria: ${materia}\n\nPergunta: ${pergunta}\n\nResponda de forma clara e educativa em português.`
                        }]
                    };
                    console.log('📦 Body:', JSON.stringify(requestBody, null, 2));

                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey,
                            'anthropic-version': '2023-06-01'
                        },
                        body: JSON.stringify(requestBody)
                    });

                    console.log('📨 Response Status:', response.status);

                    if (!response.ok) {
                        const erro = await response.json().catch(() => ({}));
                        console.error('❌ Erro API:', erro);
                        throw new Error(`Erro ${response.status}: ${erro.error?.message || erro.message || 'Erro desconhecido'}`);
                    }

                    const data = await response.json();
                    console.log('✅ Resposta recebida:', data);
                    const resposta = data.content[0].text;
                    this.chat.push({ role: 'ia', texto: resposta });
                    this.salvarDados();
                    this.renderChat();
                } catch (error) {
                    console.error('❌ Erro completo:', error.message);
                    alert(`❌ Erro: ${error.message}`);
                }
            },

            renderChat() {
                const container = document.getElementById('chatContainer');
                if (!container) return;
                
                if (this.chat.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-light); text-align: center;">Comece uma conversa! 💬</p>';
                    return;
                }
                
                container.innerHTML = this.chat.map(msg => `
                    <div class="chat-message ${msg.role}">${msg.texto}</div>
                `).join('');
                
                container.scrollTop = container.scrollHeight;
            },

            // ===== PROGRESSO =====
            renderProgresso() {
                const container = document.getElementById('progressoContainer');
                const totalNotas = this.notas.length;
                const totalFlashcards = this.flashcards.length;
                const totalProvas = this.provas.length;
                const flashcardsAcertos = this.flashcards.filter(f => f.acertou).length;
                
                container.innerHTML = `
                    <div class="card" style="margin-top: 0;">
                        <h3>📈 Estatísticas</h3>
                        <p style="margin: 10px 0; font-size: 1.1rem;">📝 Notas: <strong>${totalNotas}</strong></p>
                        <p style="margin: 10px 0; font-size: 1.1rem;">🃏 Flashcards: <strong>${totalFlashcards}</strong></p>
                        <p style="margin: 10px 0; font-size: 1.1rem;">✅ Acertos: <strong>${flashcardsAcertos}</strong></p>
                        <p style="margin: 10px 0; font-size: 1.1rem;">📋 Provas: <strong>${totalProvas}</strong></p>
                    </div>
                `;
            },

            // ===== BACKUP =====
            downloadBackup() {
                const backup = {
                    notas: this.notas,
                    flashcards: this.flashcards,
                    provas: this.provas,
                    chat: this.chat,
                    materias: this.materias,
                    data: new Date().toLocaleString('pt-BR')
                };
                
                const json = JSON.stringify(backup, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `caderno-backup-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
                alert('✅ Backup baixado!');
            },

            uploadBackup(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const backup = JSON.parse(e.target.result);
                        this.notas = backup.notas || [];
                        this.flashcards = backup.flashcards || [];
                        this.provas = backup.provas || [];
                        this.chat = backup.chat || [];
                        this.materias = backup.materias || [];
                        this.salvarDados();
                        alert('✅ Backup restaurado!');
                        location.reload();
                    } catch (error) {
                        alert('❌ Erro ao restaurar backup!');
                    }
                };
                reader.readAsText(file);
            },

            // ===== CONFIGURAÇÕES =====
            abrirConfigurações() {
                document.getElementById('modalConfigurações').style.display = 'flex';
                document.getElementById('apiKeyInput').value = localStorage.getItem('apiKey') || '';
                document.getElementById('supabaseUrlInput').value = localStorage.getItem('supabaseUrl') || '';
                document.getElementById('supabaseKeyInput').value = localStorage.getItem('supabaseKey') || '';
            },

            fecharConfigurações() {
                document.getElementById('modalConfigurações').style.display = 'none';
            },

            salvarApiKey() {
                console.log('💾 Iniciando salvarApiKey()...');
                const apiKeyInput = document.getElementById('apiKeyInput');
                console.log('🔍 Elemento apiKeyInput encontrado:', apiKeyInput);
                
                const apiKey = apiKeyInput.value.trim();
                const supabaseUrl = document.getElementById('supabaseUrlInput').value.trim();
                const supabaseKey = document.getElementById('supabaseKeyInput').value.trim();
                
                console.log('📝 Valores capturados:');
                console.log('  - apiKey:', apiKey ? `✅ (${apiKey.length} chars)` : '❌ vazio');
                console.log('  - supabaseUrl:', supabaseUrl ? `✅ ${supabaseUrl}` : '❌ vazio');
                console.log('  - supabaseKey:', supabaseKey ? `✅ (${supabaseKey.length} chars)` : '❌ vazio');
                
                if (apiKey) {
                    localStorage.setItem('apiKey', apiKey);
                    console.log('✅ API Key salva no localStorage');
                }
                if (supabaseUrl) {
                    localStorage.setItem('supabaseUrl', supabaseUrl);
                    console.log('✅ Supabase URL salva no localStorage');
                }
                if (supabaseKey) {
                    localStorage.setItem('supabaseKey', supabaseKey);
                    console.log('✅ Supabase Key salva no localStorage');
                }
                
                console.log('🎯 Verificando localStorage:', localStorage.getItem('apiKey'));
                alert('✅ Configurações salvas!');
                this.fecharConfigurações();
            },

            apagarApiKey() {
                if (confirm('Tem certeza que quer apagar tudo?')) {
                    localStorage.removeItem('apiKey');
                    localStorage.removeItem('supabaseUrl');
                    localStorage.removeItem('supabaseKey');
                    alert('✅ Dados apagados!');
                    this.fecharConfigurações();
                }
            }
        };

        // Inicializar quando carregar
        window.addEventListener('load', () => app.init());
    </script>
</body>
</html>
