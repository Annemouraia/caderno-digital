<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="#0a0e27"/>
  
  <!-- Gradient border -->
  <rect x="10" y="10" width="172" height="172" fill="none" stroke="url(#grad)" stroke-width="3" rx="30"/>
  
  <!-- Gradientes -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculos concêntricos animados -->
  <g transform="translate(96, 96)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#ff006e" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#00d4ff" opacity="0.9"/>
  </g>
  
  <!-- Livro/Caderno -->
  <g transform="translate(96, 130)">
    <rect x="-20" y="-5" width="40" height="20" fill="none" stroke="#00d4ff" stroke-width="2" rx="3"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Linhas de texto (notas) -->
  <g transform="translate(50, 70)" opacity="0.6">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#0099ff" stroke-width="1.5"/>
    <line x1="0" y1="8" x2="40" y2="8" stroke="#0099ff" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="35" y2="16" stroke="#0099ff" stroke-width="1.5"/>
  </g>
  
  <!-- Microfone -->
  <g transform="translate(128, 70)" opacity="0.7">
    <circle cx="0" cy="0" r="4" fill="#ff006e"/>
    <rect x="-2" y="4" width="4" height="12" fill="#ff006e"/>
  </g>
</svg>
